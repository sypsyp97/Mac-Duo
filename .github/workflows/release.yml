name: Release

# Deliberate: tag a version to publish one. Building every push to main
# produced a "dev" release that nobody could tell apart from the last.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-duo-pro-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      APP_PATH: build/Mac Duo Pro.app
      DIST_PATH: build/release

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the version in the tag matches the bundle
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$TAG" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $VERSION"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "dmg=Mac-Duo-Pro-$VERSION.dmg"
            echo "zip=Mac-Duo-Pro-$VERSION.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build universal
        run: |
          set -euo pipefail
          ./build.sh --universal
          lipo "$APP_PATH/Contents/MacOS/MacDuo" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures "$APP_PATH"

      - name: Package
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg }}
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
        run: |
          set -euo pipefail
          mkdir -p "$DIST_PATH"
          STAGING="$(mktemp -d "$RUNNER_TEMP/dmg.XXXXXX")"
          trap 'rm -rf "$STAGING"' EXIT
          ditto "$APP_PATH" "$STAGING/Mac Duo Pro.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname 'Mac Duo Pro' -srcfolder "$STAGING" \
            -fs HFS+ -format UDZO "$DIST_PATH/$DMG_NAME"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$DIST_PATH/$ZIP_NAME"

      - name: Write the notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf '**Mac Duo Pro %s**\n\n' "$VERSION"
            printf 'Open the DMG and drag **Mac Duo Pro** to **Applications**, or unzip it there.\n\n'
            printf 'Requires macOS 14 or later and a MacBook with a lid angle sensor.\n'
            printf 'Universal: Apple Silicon and Intel.\n\n'
            printf '### First launch\n\n'
            printf 'This build is signed ad-hoc, not with a Developer ID, so Gatekeeper will\n'
            printf 'refuse it on a double click. Right-click the app and choose **Open**, or:\n\n'
            printf '```sh\nxattr -dr com.apple.quarantine "/Applications/Mac Duo Pro.app"\n```\n\n'
            printf 'Grant Screen Recording when asked. The camera is optional and only used if\n'
            printf 'you press Calibrate; it never runs while the effect does.\n'
          } > "$DIST_PATH/NOTES.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "$DIST_PATH/${{ steps.meta.outputs.dmg }}" \
            "$DIST_PATH/${{ steps.meta.outputs.zip }}" \
            --target "$GITHUB_SHA" --title "Mac Duo Pro $VERSION" \
            --notes-file "$DIST_PATH/NOTES.md"
